name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the first run commit go.sum
  packages: write   # push images to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Latest patched Go, matching golang:1-alpine in the Dockerfiles.
          # go.mod's "go 1.26.0" is the minimum, not the version to build with:
          # pinning CI to it fails govulncheck on standard-library fixes.
          go-version: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve Go modules
        run: go mod tidy

      - name: Commit go.mod / go.sum if they changed
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: update go.mod and go.sum [skip ci]"
            git push
          fi

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Audit npm dependencies
        run: cd web && npm audit --omit=dev --audit-level=moderate

      - name: Scan Go code and dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: CGO_ENABLED=0 go build ./...

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tainerhub
            dockerfile: Dockerfile.hub
          - image: tainerhub-agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # includes the go.sum commit from the test job

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: echo "version=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore  # accepted CVEs, each with a reason and expiry
          exit-code: "1"
