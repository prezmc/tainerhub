name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the images job, which never runs for pull
# requests, gets to write packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest patched Go, matching golang:1-alpine in the Dockerfiles.
          # go.mod's "go 1.26.0" is the minimum, not the version to build with:
          # pinning CI to it fails govulncheck on standard-library fixes.
          go-version: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check go.mod / go.sum are tidy
        # Fails (and prints the diff) instead of fixing them: run `go mod tidy`
        # locally and commit the result.
        run: go mod tidy -diff

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Test web UI helpers
        run: cd web && npm test

      - name: Audit npm dependencies
        run: cd web && npm audit --omit=dev --audit-level=moderate

      - name: Scan Go code and dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: CGO_ENABLED=0 go build ./...

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to ghcr.io
    strategy:
      matrix:
        include:
          - image: tainerhub
            dockerfile: Dockerfile.hub
          - image: tainerhub-agent
            dockerfile: Dockerfile.agent
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: echo "version=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Push only the immutable version tag; :latest follows once the scan passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore  # accepted CVEs, each with a reason and expiry
          exit-code: "1"

      - name: Tag the scanned image as latest
        # Points :latest at the same multi-arch index (attestations included).
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
