# TainerHub agent. Run on every Docker host, including the one running the hub.
# The easiest way to get this file: TainerHub -> Hosts -> Add host, which fills in the join token.

services:
  tainerhub-agent:
    image: ghcr.io/prezmc/tainerhub-agent:latest
    container_name: tainerhub-agent
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/tainerhub-agent", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tainerhub-agent:/data      # the agent's certificate; keep it to avoid re-enrolling
      # Compose stacks live here. Keep the SAME path on both sides: compose
      # resolves relative bind mounts (./data) to paths the host must also see.
      - /opt/tainerhub/stacks:/opt/tainerhub/stacks
    environment:
      TAINERHUB_HUB: 192.168.1.10:7443   # the hub server, port 7443 (never through a proxy)
      # One-time token from the Hosts page, valid for 1 hour. Remove after the first start.
      TAINERHUB_JOIN_TOKEN: thj1_paste-token-here

volumes:
  tainerhub-agent:
