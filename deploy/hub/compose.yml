# TainerHub hub. Easiest install (does all of this and prints your setup link):
#
#   curl -fsSL https://raw.githubusercontent.com/prezmc/tainerhub/main/install.sh | sh
#
# By hand:
#   mkdir -p ~/tainerhub && cd ~/tainerhub
#   curl -fsSLO https://raw.githubusercontent.com/prezmc/tainerhub/main/deploy/hub/compose.yml
#   docker compose up -d
#   docker exec tainerhub /tainerhub db-password   # save this
#   docker exec tainerhub /tainerhub setup-link    # open http://<this server's IP>:8585 + this
# HTTPS through a reverse proxy, and passkeys, can be added later (see the README).

services:
  tainerhub:
    image: ghcr.io/prezmc/tainerhub:latest
    container_name: tainerhub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/tainerhub", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8585:8585"   # web UI and API (plain HTTP until you add a reverse proxy)
      - "7443:7443"   # agents connect here (mTLS); never put this behind a proxy
    networks: [default, db]
    volumes:
      - tainerhub-data:/data   # holds the hub's certificate authority: back this up
    environment:
      TAINERHUB_DATABASE_URL: postgres://tainerhub:${DB_PASSWORD:-tainerhub}@postgres:5432/tainerhub?sslmode=disable
      TAINERHUB_LOG_LEVEL: info
      # ---- optional, after install ----
      # HTTPS address once a reverse proxy serves TainerHub; turns on passkeys:
      # TAINERHUB_PUBLIC_URL: https://tainerhub.example.com
      # The reverse proxy's IP, so sign-in limits and the audit log see real client IPs:
      # TAINERHUB_TRUSTED_PROXIES: 192.168.1.20

  postgres:
    image: postgres:17-alpine
    container_name: tainerhub-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    networks: [db]   # internal only: nothing outside this stack can reach the database
    environment:
      POSTGRES_USER: tainerhub
      POSTGRES_DB: tainerhub
      # Only reachable from the hub. On first start the hub replaces this
      # default with a random password, saves it in its /data volume and prints
      # it once. To choose your own instead, set DB_PASSWORD in a .env file next
      # to this one before the first start.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tainerhub}
    volumes:
      - tainerhub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tainerhub -d tainerhub"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  db:
    internal: true

volumes:
  tainerhub-data:
  tainerhub-db:
